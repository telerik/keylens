<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keylens Clean Test Fixture — No A11y Issues</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      nav {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        padding: 1rem;
        background: #f0f0f0;
      }
      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 100;
        padding: 0.5rem 1rem;
        background: #000;
        color: #fff;
      }
      .skip-link:focus {
        left: 0;
      }
      main {
        max-width: 800px;
      }
      a:focus,
      button:focus,
      input:focus,
      select:focus {
        outline: 2px solid #005fcc;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <nav>
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>

    <main id="main-content" tabindex="-1">
      <h1>Clean Test Page</h1>
      <p>This page has no keyboard accessibility issues.</p>

      <button>Submit</button>
      <a href="/learn-more">Learn More</a>
      <input type="text" placeholder="Your name" aria-label="Your name" />
      <select aria-label="Choose option">
        <option>Option 1</option>
        <option>Option 2</option>
      </select>
    </main>
  </body>
</html>
