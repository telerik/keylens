<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>t</title>
    <style>
      @keyframes pulse {
        from {
          background: #eee;
        }
        to {
          background: #9cf;
        }
      }
      button {
        outline: none;
        margin: 20px;
        padding: 10px 20px;
        animation: pulse 0.7s infinite alternate;
      }
    </style>
  </head>
  <body>
    <main><button id="a">Animated, no focus style</button></main>
  </body>
</html>
