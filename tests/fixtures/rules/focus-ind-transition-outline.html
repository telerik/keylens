<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>t</title>
    <style>
      button {
        outline: 3px solid transparent;
        margin: 20px;
        padding: 10px 20px;
        transition: outline-color 0.15s;
      }
      button:focus-visible {
        outline-color: rgb(0, 90, 220);
      }
    </style>
  </head>
  <body>
    <main><button id="a">Transition into outline</button></main>
  </body>
</html>
