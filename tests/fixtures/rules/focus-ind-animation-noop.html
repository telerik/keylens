<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>t</title>
    <style>
      button {
        outline: none;
        margin: 20px;
        padding: 10px 20px;
      }
      @keyframes noop {
        from {
          opacity: 1;
        }
        to {
          opacity: 1;
        }
      }
      button:focus-visible {
        animation: noop 0.3s forwards;
      }
    </style>
  </head>
  <body>
    <main>
      <button id="a">Focus animation that changes nothing visible</button>
    </main>
  </body>
</html>
