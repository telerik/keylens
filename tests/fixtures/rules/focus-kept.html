<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>t</title>
    <style>
      a:focus,
      button:focus,
      input:focus {
        outline: 3px solid blue;
      }
    </style>
  </head>
  <body>
    <main><button id="a">Toggle</button><button id="b">B</button></main>
    <script>
      const a = document.getElementById("a");
      a.addEventListener("click", () => {
        a.textContent = "On";
      });
    </script>
  </body>
</html>
