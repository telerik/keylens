<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>t</title>
    <style>
      a:focus,
      button:focus,
      input:focus {
        outline: 3px solid blue;
      }
    </style>
  </head>
  <body>
    <main><button id="trap">Trapped</button></main>
    <script>
      document.getElementById("trap").addEventListener("keydown", (e) => {
        if (e.key === "Tab") e.preventDefault();
      });
    </script>
  </body>
</html>
