<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Keylens homepage demo</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        color: #1a1a2e;
        background: #ffffff;
      }
      header {
        display: flex;
        gap: 24px;
        align-items: center;
        padding: 20px 32px;
        border-bottom: 1px solid #e5e7eb;
      }
      header a {
        color: #1a1a2e;
        text-decoration: none;
        font-weight: 600;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 48px 32px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      p.lede {
        color: #4b5563;
        margin: 0 0 32px;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 24px;
        margin-bottom: 20px;
      }
      /* Intentional: focused state is visually identical to unfocused. */
      .no-focus-indicator:focus {
        outline: none;
      }
      button,
      input,
      a.button {
        font-size: 15px;
      }
      .fake-button {
        display: inline-block;
        padding: 10px 18px;
        background: #3d57d8;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Intentional: no skip link before the nav. -->
    <header>
      <a href="/">Acme</a>
      <a href="/pricing">Pricing</a>
      <a href="/docs">Docs</a>
    </header>
    <main>
      <h1>Upgrade your plan</h1>
      <p class="lede">Pick the plan that fits your team.</p>

      <div class="card">
        <h2>Pro</h2>
        <p>Everything in Free, plus priority support.</p>
        <a href="/checkout" class="no-focus-indicator">Continue to checkout</a>
      </div>

      <div class="card">
        <h2>Newsletter</h2>
        <label for="email">Email address</label><br />
        <input id="email" type="email" placeholder="you@example.com" />
        <button type="submit">Subscribe</button>
      </div>

      <!-- Intentional: has role="button" (so it's discovered as an
           interactive control) but no tabindex, so real users can never
           Tab to it — only click it with a mouse. -->
      <div class="fake-button" role="button" onclick="alert('clicked')">
        Dismiss
      </div>
    </main>
  </body>
</html>
