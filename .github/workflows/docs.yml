name: Docs

on:
  push:
    branches: [develop]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm ci --no-audit --no-fund
      - run: npm run docs:build
        env:
          # Internal/private repos serve Pages from a randomized
          # <slug>.pages.github.io domain root, not <org>.github.io/<repo>/,
          # so the site must be built with a root base path for those. Once
          # this repo turns public, Pages serves from
          # <org>.github.io/<repo>/, so the base path must include the repo
          # name — this expression switches automatically, no manual edit
          # needed at the visibility flip.
          DOCS_BASE: ${{ github.event.repository.visibility == 'public' && '/keylens/' || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
