name: Publish

on:
  push:
    branches: [master, develop]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci]
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          KEYLENS_TELEMETRY_IDENTITY_API_KEY: ${{ secrets.KEYLENS_TELEMETRY_IDENTITY_API_KEY }}
          KEYLENS_TELEMETRY_TOKEN_URL: ${{ vars.KEYLENS_TELEMETRY_TOKEN_URL }}
          KEYLENS_TELEMETRY_ENDPOINT: ${{ vars.KEYLENS_TELEMETRY_ENDPOINT }}

      - name: Verify package
        run: node scripts/verify-package.mjs

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
