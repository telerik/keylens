name: Publish

on:
  push:
    branches: [master, develop]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 26
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@telerik"

      - name: Install dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          KEYLENS_TELEMETRY_IDENTITY_API_KEY: ${{ secrets.KEYLENS_TELEMETRY_IDENTITY_API_KEY }}
          KEYLENS_TELEMETRY_TOKEN_URL: ${{ vars.KEYLENS_TELEMETRY_TOKEN_URL }}
          KEYLENS_TELEMETRY_ENDPOINT: ${{ vars.KEYLENS_TELEMETRY_ENDPOINT }}

      - name: Verify dist
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/cli/index.js
          test -f dist/mcp/server.js
          test -f dist/mcp/server.d.ts

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
