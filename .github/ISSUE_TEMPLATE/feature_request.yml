name: Feature Request
description: Suggest a new feature or rule
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Keylens!

  - type: dropdown
    id: type
    attributes:
      label: Feature type
      options:
        - New rule
        - New reporter
        - AI enhancement
        - CLI improvement
        - API / programmatic usage
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: What would you like Keylens to do?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What problem does this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Suggested implementation (optional)
      description: Any ideas on how this could work?

  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to contribute this?
      options:
        - "Yes, I'd like to implement this"
        - "I can help with testing/review"
        - "No, but I'd use it"
